name: HandDrawnFontDemo

options:
  bundleIdPrefix: software.handdrawn
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

packages:
  HandDrawnFont:
    path: ..

targets:
  HandDrawnFontDemo:
    type: application
    platform: iOS
    sources:
      - path: HandDrawnFontDemo
    dependencies:
      - package: HandDrawnFont
        product: HandDrawnFont
      - package: HandDrawnFont
        product: HandDrawnFontDebug
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hand Drawn Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: software.handdrawn.demo
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  HandDrawnFontDemo:
    build:
      targets:
        HandDrawnFontDemo: all
    run:
      config: Debug
    archive:
      config: Release
